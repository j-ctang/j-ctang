<svg xmlns="http://www.w3.org/2000/svg" width="640" height="682" viewBox="0 0 640 682" role="img" aria-labelledby="title description">
  <title id="title">Jev Prune for Claude Code</title>
  <desc id="description">Jev Prune trims stale tool results and keeps visible chat intact. The terminal illustrates the stats and doctor commands, including pruning defaults and installation requirements. A TODO notes the plan to explore a local model in place of TypeSafe. Install from the GitHub repository with npm link.</desc>
  <style>
    .install-second, .check-command, .prompt-caret, .scrollback { display: none; }
    .transcript { transform: translateY(-429px); }
