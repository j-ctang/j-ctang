      .install-second { animation: reveal-second 15s step-end infinite; }
      .transcript { animation: advance-terminal 15s step-end infinite; }
      .first-input { animation: type-first 15s linear infinite; }
      .second-input { animation: type-second 15s linear infinite; }
      .first-caret { animation: caret-first 15s linear infinite; }
