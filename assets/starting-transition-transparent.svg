<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title">
<title id="title">Startup messages fade into a desktop with session.log in the foreground</title>
<!-- Lettering outlined from Paper Mono v1.000 by Paper Design. -->
<style>
  .pane { transform-origin: 18px 12px; }
  .pane text { font-family: 'Courier New', monospace; font-size: 11px; }
  .pane text.window-title { font-weight: 700; }
  .pane text.type-sample { font: 66px Georgia, serif; }
  .pane text.project-name { font: 700 24px 'Courier New', monospace; }
  .boot { display: none; fill: #24272d; }
  .boot .handoff { paint-order: stroke; stroke: #fbfaf4; stroke-width: 2px; }
  .log { transform-box: fill-box; }
  .lettering { stroke: #767d86; }
  .guides { stroke: #8d949d; stroke-opacity: .65; }
  .guide-points { fill: #5276b1; }
  @media (prefers-color-scheme: dark) {
    .boot { fill: #eef1f6; }
    .boot .handoff { stroke: #24272d; }
    .lettering { stroke: #a0aab7; }
    .guides { stroke: #7b8798; }
    .guide-points { fill: #8eafe5; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .pane { animation: pop-in 620ms cubic-bezier(.2,.75,.25,1) 1 both; }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(12px) scale(.94); }
      to { opacity: 1; transform: none; }
    }
    .boot { display: inline; }
    .beat {
      animation: fade-in 170ms linear var(--enter) 1 both,
                 fade-out 260ms linear var(--exit) 1 forwards;
    }
    .lettering { animation: fade-in 620ms ease 2800ms 1 both; }
    .log { animation: open-log 260ms ease-out 2460ms 1 both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes open-log {
      from { opacity: 0; clip-path: inset(0 100% 0 0); }
      to { opacity: 1; clip-path: inset(0); }
    }
    .pane0 { animation-delay: 3100ms; }
    .pane1 { animation-delay: 4600ms; }
    .pane2 { animation-delay: 6100ms; }
    .pane3 { animation-delay: 7600ms; }
    .pane4 { animation-delay: 9100ms; }
    .pane5 { animation-delay: 10600ms; }
    .pane7 { animation-delay: 12100ms; }
    .pane8 { animation-delay: 13600ms; }
    .pane9 { animation-delay: 15100ms; }
    .soundtrack { animation-delay: 15500ms; }
  }
</style>
